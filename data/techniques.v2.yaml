    distinction: Foisonner désigne le résultat, le volume gagné par l'air incorporé ; fouetter est le geste de battre au fouet, qui n'aère pas toujours.
  - technique_id: tech_serrer
    distinction: Foisonner incorpore l'air pour gonfler la masse ; serrer raffermit des blancs déjà montés en y ajoutant du sucre.
- id: tech_lier
  name: Lier
  aliases:
  - lier
  - lié
  - liée
  - lier la sauce
  category: liaison
  difficulty: 2
  definition: Épaissir et rendre homogène une préparation à l'aide d'un roux, d'un jaune d'œuf, de fécule ou de beurre.
  hierarchy:
    parent: null
    level: 0
  expected_result:
    summary: La préparation est épaissie et homogène, elle nappe sans être liquide ni pâteuse.
    observable_indicators:
    - Consistance nappante, tient sur la cuillère
    - Texture lisse, sans grumeaux
    - Brillance selon le liant
  common_errors:
  - Verser le liant dans un liquide bouillant sans précaution, grumeaux
  - Trop de liant, sauce pâteuse
  - Cuisson insuffisante du roux ou de la fécule, goût farineux
  not_to_be_confused_with:
  - technique_id: tech_reduire
    distinction: Lier épaissit à l'aide d'un liant, roux, jaune, fécule ou beurre ; réduire épaissit sans liant, par simple évaporation.
  - technique_id: tech_emulsionner
    distinction: Lier rend une préparation épaisse et homogène ; émulsionner unit spécifiquement un gras et un liquide aqueux en une émulsion stable.
  - technique_id: tech_detendre
    distinction: Lier épaissit une préparation ; détendre l'assouplit au contraire en y ajoutant du liquide.
- id: tech_serrer
  name: Serrer les blancs
  aliases:
  - serrer les blancs
  - blancs serrés
  - serrer la meringue
  category: liaison
  difficulty: 2
  definition: Terminer des blancs en neige en y ajoutant un peu de sucre tout en fouettant, pour les raffermir et les rendre lisses et brillants.
  hierarchy:
    parent: tech_grp_aerer
    level: 1
  expected_result:
    summary: Les blancs montés sont raffermis, lisses et brillants, resserrés par l'ajout de sucre en fouettant.
    observable_indicators:
    - Blancs fermes qui font le bec d'oiseau
    - Surface lisse et satinée
    - Masse serrée qui ne retombe pas
  common_errors:
  - Ajouter le sucre trop tôt ou trop vite, blancs qui grainent
  - Trop fouetter, blancs granuleux et secs
  - Blancs pas assez montés avant de serrer
  not_to_be_confused_with:
  - technique_id: tech_foisonner
    distinction: Serrer les blancs les raffermit et les lisse avec du sucre en fin de montage ; foisonner désigne l'incorporation d'air qui gonfle la préparation.
- id: tech_tourer
  name: Tourer
  aliases:
  - tourer
  - touré
  - tourée
  - donner un tour
  - donner les tours
  - tourage
  category: preparation
  difficulty: 5
  definition: Donner ses tours à une pâte feuilletée en pliant et abaissant successivement la détrempe et le beurre, pour créer les couches, geste long et minutieux.
  hierarchy:
    parent: tech_grp_travail_pate
    level: 1
  expected_result:
    summary: La pâte feuilletée a reçu ses tours, les couches alternées de détrempe et de beurre sont régulières et distinctes.
    observable_indicators:
    - Beurre réparti en couche régulière, non percé
    - Angles droits, abaisse régulière
    - Nombre de tours respecté, pâte reposée au frais
  common_errors:
  - Beurre trop mou ou trop dur qui perce ou casse les couches
  - Ne pas respecter les temps de repos, le beurre traverse
  - Tours mal comptés, feuilletage irrégulier
  not_to_be_confused_with:
  - technique_id: tech_tourner
    distinction: Tourer plie et abaisse une pâte feuilletée pour créer ses couches ; tourner façonne un légume à plusieurs faces au couteau, ce sont des faux amis.
- id: tech_desosser
  name: Désosser
  aliases:
  - désosser
  - desosser
  - désossé
  - désossée
  category: preparation
  difficulty: 3
  definition: Retirer les os d'une pièce de viande ou de volaille en préservant au mieux la chair.
  hierarchy:
    parent: null
    level: 0
  expected_result:
    summary: Les os sont retirés en préservant la chair, qui reste en morceau exploitable, à farcir, rouler ou trancher.
    observable_indicators:
    - Chair sans esquilles d'os
    - Peu de chair laissée sur les os
    - Pièce entière prête à farcir ou rouler
  common_errors:
  - Déchirer ou trouer la chair
  - Laisser des esquilles d'os
  - Couteau inadapté au lieu d'un désosseur
  not_to_be_confused_with:
  - technique_id: tech_lever_filets
    distinction: Désosser retire les os d'une viande ou d'une volaille en gardant la chair ; lever les filets sépare la chair du poisson de son arête.
  - technique_id: tech_parer
    distinction: Désosser ôte les os de la pièce ; parer la débarrasse des nerfs, du gras et des parties non comestibles.
- id: tech_degorger
  name: Dégorger
  aliases:
  - dégorger
  - degorger
  - dégorgé
  - dégorge
  category: preparation
  difficulty: 2
  definition: Faire rendre son eau à un légume au sel (concombre, aubergine), ou purger une viande ou un abat à l'eau froide.
  hierarchy:
    parent: tech_grp_pretraiter
    level: 1
  expected_result:
    summary: L'aliment a rendu son eau au sel, ou a été purgé de son sang et de ses impuretés à l'eau froide.
    observable_indicators:
    - Eau perceptiblement rendue, le légume ramollit
    - Amertume ou âcreté atténuée
    - Eau de purge devenue claire
  common_errors:
  - Sel insuffisant ou temps trop court, l'eau n'est pas rendue
  - Ne pas rincer ni éponger le sel ensuite
  - Dégorger trop longtemps, l'aliment ramollit trop
  not_to_be_confused_with:
  - technique_id: tech_mariner
    distinction: Dégorger fait rendre l'eau, au sel, ou purge à l'eau froide ; mariner imprègne au contraire l'aliment d'un liquide aromatique.
  - technique_id: tech_monder
    distinction: Dégorger fait rendre l'eau ou purge l'aliment ; monder lui retire la peau après ébouillantage.
- id: tech_petrir
  name: Pétrir
  aliases:
  - pétrir
  - petrir
  - pétri
  - pétrie
  - pétrissage
  category: preparation
  difficulty: 1
  definition: Travailler une pâte à la main ou au crochet pour l'homogénéiser et développer le réseau de gluten.
  hierarchy:
    parent: tech_grp_travail_pate
    level: 1
  expected_result:
    summary: La pâte est lisse, élastique et homogène, son réseau de gluten développé, elle se tend sans se déchirer.
    observable_indicators:
    - Pâte lisse et souple
    - Test de la fenêtre, la pâte s'étire fine
    - Élasticité, la pâte reprend sa forme
  common_errors:
  - Sous-pétrir, pâte qui se déchire et mie serrée
  - Sur-pétrir au robot, la pâte chauffe et se relâche
  - Ajouter trop de farine pendant le pétrissage
  not_to_be_confused_with:
  - technique_id: tech_fouetter
    distinction: Pétrir travaille une pâte, à la main ou au crochet, pour développer le gluten ; fouetter bat au fouet pour aérer ou émulsionner un appareil liquide.
- id: tech_tamiser
