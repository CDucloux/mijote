  - Forcer une poudre humide qui bourre le tamis
  not_to_be_confused_with: []
- id: tech_barder
  name: Barder
  aliases:
  - barder
  - bardé
  - bardée
  category: preparation
  difficulty: 2
  definition: Entourer une pièce d'une fine tranche de lard gras avant cuisson pour la nourrir et l'empêcher de se dessécher.
  hierarchy:
    parent: tech_grp_enrober
    level: 1
  expected_result:
    summary: La pièce est enveloppée d'une fine tranche de lard gras qui la protégera du dessèchement et la nourrira à la cuisson.
    observable_indicators:
    - Barde ajustée et maintenue
    - Surface régulièrement couverte
    - Gras qui fondra pour arroser la chair
  common_errors:
