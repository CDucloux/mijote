  - tamisée
  - tamise
  category: preparation
  difficulty: 1
  definition: Passer une poudre (farine, sucre glace) au tamis pour l'aérer et éliminer les grumeaux.
  hierarchy:
    parent: null
    level: 0
  expected_result:
