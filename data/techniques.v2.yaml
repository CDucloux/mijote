  not_to_be_confused_with:
  - technique_id: tech_paner
    distinction: Barder enveloppe la pièce de lard gras, pour la nourrir et éviter le dessèchement ; paner l'enrobe de chapelure pour la croûte.
- id: tech_chiqueter
  name: Chiqueter
  aliases:
  - chiqueter
  - chiqueté
  - chiquetée
  - chiquetage
  category: dressage
  difficulty: 3
  definition: Inciser en biais et à intervalles réguliers les bords d'un feuilletage, pour favoriser sa levée et le décorer.
  hierarchy:
    parent: tech_grp_decor_feuilletage
    level: 1
  expected_result:
    summary: Les bords du feuilletage sont incisés en biais à intervalles réguliers, ce qui favorise une levée droite et décore la pièce.
    observable_indicators:
    - Encoches régulières sur la tranche
    - Bords qui lèvent droit et net
    - Motif décoratif visible
  common_errors:
  - Inciser trop profond, jusqu'à ouvrir le feuilletage
  - Espacement irrégulier
  - Dos du couteau qui écrase la tranche au lieu d'inciser net
  not_to_be_confused_with:
  - technique_id: tech_rayer
    distinction: Chiqueter incise les bords du feuilletage pour la levée ; rayer décore la surface dorée sans la percer.
