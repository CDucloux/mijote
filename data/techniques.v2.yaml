- id: tech_suer
  name: Suer
  aliases:
  - suer
  - faire suer
  - sué
  - suée
  category: cuisson
  difficulty: 1
  definition: 'Cuire doucement un aliment, souvent des légumes, dans un peu de corps gras, à feu doux et sans coloration, pour lui faire rendre son eau et concentrer ses arômes avant la suite de la cuisson.

    '
  source: Escoffier, Le Guide Culinaire (1903)
  hierarchy:
    parent: tech_grp_cuire_sans_colorer
    level: 1
  expected_result:
    summary: Les légumes ont rendu leur eau et se sont attendris sans prendre de couleur, arômes concentrés.
    observable_indicators:
    - Aucune coloration
    - Légumes translucides et fondants
    - Léger suintement d'eau évaporé
  common_errors:
  - Feu trop vif, coloration, ce n'est plus suer
  - Sel oublié qui aiderait à rendre l'eau
  - Aller trop vite, légumes encore croquants et âcres
  not_to_be_confused_with:
  - technique_id: tech_revenir
    distinction: Suer se fait sans coloration, à feu doux, pour rendre l'eau ; faire revenir cherche au contraire une légère coloration.
  - technique_id: tech_nacrer
    distinction: Suer fait rendre son eau à un légume ; nacrer enrobe des grains de riz de gras jusqu'à les rendre translucides.
- id: tech_deglacer
  name: Déglacer
  aliases:
  - déglacer
  - deglacer
  - déglacé
  - déglace
  category: cuisson
  difficulty: 2
  definition: 'Dissoudre les sucs caramélisés au fond d''un récipient de cuisson en y versant un liquide (vin, fonds, vinaigre) et en grattant, pour en faire la base d''une sauce.

    '
  source: Escoffier, Le Guide Culinaire (1903)
  hierarchy:
    parent: tech_grp_travail_fonds
    level: 1
  expected_result:
    summary: Les sucs caramélisés collés au fond sont dissous dans le liquide ajouté, formant la base d'une sauce.
    observable_indicators:
    - Fond du récipient redevenu propre
    - Liquide coloré et parfumé par les sucs
    - Grattage qui décolle les sucs
  common_errors:
  - Sucs brûlés avant le déglaçage, d'où l'amertume
  - Trop de liquide qui dilue le goût
  - Ne pas gratter, les sucs restent collés
  not_to_be_confused_with:
  - technique_id: tech_reduire
    distinction: Déglacer dissout les sucs avec un liquide ; réduire concentre ensuite ce liquide par évaporation.
  - technique_id: tech_flamber
    distinction: Déglacer dissout les sucs du fond avec un liquide ; flamber enflamme un alcool versé sur le mets pour le parfumer.
- id: tech_monder
  name: Monder
  aliases:
  - monder
  - émonder
  - emonder
  - mondé
  - monde
  category: preparation
  difficulty: 1
  definition: 'Retirer la peau d''un aliment (tomate, amande, pêche) après l''avoir brièvement plongé dans l''eau bouillante puis refroidi.

    '
  hierarchy:
    parent: tech_grp_pretraiter
    level: 1
  expected_result:
    summary: La peau se détache et se retire aisément après un bref choc thermique, laissant la chair nue et intacte.
    observable_indicators:
    - Peau qui se pèle sans effort
    - Chair non cuite en dessous
    - Aspect net, tomate ou amande
  common_errors:
  - Trop laisser dans l'eau bouillante, la chair cuit
  - Ne pas rafraîchir, la peau colle
  - Entaille en croix oubliée sur la tomate, qui gêne l'épluchage
  not_to_be_confused_with:
  - technique_id: tech_blanchir
    distinction: Monder retire la peau après un bref ébouillantage ; blanchir est ce passage à l'eau bouillante lui-même, sans forcément peler.
  - technique_id: tech_degorger
    distinction: Monder retire la peau après un bref passage à l'eau bouillante ; dégorger fait rendre son eau à l'aliment, au sel, ou le purge.
- id: tech_blanchir
  name: Blanchir
  aliases:
  - blanchir
  - blanchi
  - blanchie
  - blanchit
  category: cuisson
  difficulty: 1
  definition: 'Plonger un aliment quelques instants dans l''eau bouillante (puis souvent le rafraîchir) pour le raffermir, l''attendrir, fixer sa couleur ou en retirer l''âcreté.

    '
  hierarchy:
    parent: tech_grp_cuisson_liquide
    level: 1
  expected_result:
    summary: L'aliment est raffermi ou sa couleur fixée après un bref passage à l'eau bouillante, souvent suivi d'un rafraîchissement qui stoppe net la cuisson.
    observable_indicators:
    - Couleur des légumes verts avivée et fixée
    - Cœur encore ferme, ce n'est pas une cuisson complète
    - Refroidissement rapide à l'eau glacée
  common_errors:
  - Prolonger jusqu'à cuire complètement l'aliment
  - Oublier de rafraîchir, la cuisson continue et la couleur vire
  - Volume d'eau trop faible qui retombe de l'ébullition
  not_to_be_confused_with:
  - technique_id: tech_pocher
    distinction: Blanchir est un bref passage à l'eau bouillante, un prétraitement ; pocher est une cuisson complète à frémissement.
  - technique_id: tech_monder
    distinction: Blanchir plonge l'aliment dans l'eau bouillante pour le raffermir ou fixer sa couleur ; monder utilise ce passage précisément pour en retirer la peau.
  - technique_id: tech_cuire_a_blanc
    distinction: Blanchir est un passage à l'eau bouillante ; cuire à blanc précuit à sec un fond de tarte au four, aucun rapport malgré le mot blanc.
- id: tech_emulsionner
  name: Émulsionner
  aliases:
  - émulsionner
  - emulsionner
  - émulsion
  - monter une émulsion
  category: liaison
  difficulty: 4
  definition: 'Mélanger énergiquement deux liquides qui ne se lient pas naturellement (gras et aqueux), souvent à l''aide d''un jaune d''œuf ou de moutarde, pour obtenir une texture homogène et stable.

    '
  hierarchy:
    parent: tech_grp_emulsion
    level: 1
  expected_result:
    summary: Deux liquides non miscibles, gras et aqueux, forment un mélange homogène, lisse et stable qui ne se sépare pas.
    observable_indicators:
    - Texture crémeuse homogène
    - Aucune séparation gras et eau
    - Tenue stable dans le temps
  common_errors:
  - Incorporer le gras trop vite, l'émulsion tranche
  - Ingrédients à températures trop différentes
  - Cesser de fouetter trop tôt, liaison instable
  not_to_be_confused_with:
  - technique_id: tech_lier
    distinction: Émulsionner unit un corps gras et un liquide aqueux qui ne se mélangent pas ; lier épaissit une préparation à l'aide d'un liant.
  - technique_id: tech_monter_au_beurre
    distinction: Émulsionner désigne l'émulsion en général, mayonnaise ou vinaigrette ; monter au beurre est l'émulsion d'un beurre froid dans une sauce, hors du feu.
- id: tech_napper
  name: Napper
  aliases:
  - napper
  - nappé
  - nappe
  - nappant
  category: dressage
  difficulty: 2
  definition: 'Recouvrir un mets d''une couche régulière de sauce ; la sauce « nappe » quand elle est assez réduite pour tenir sur le dos d''une cuillère.

    '
  source: Escoffier, Le Guide Culinaire (1903)
  hierarchy:
    parent: tech_grp_recouvrir
    level: 1
  expected_result:
    summary: Le mets est recouvert d'une couche régulière de sauce, assez réduite pour tenir et napper la cuillère.
    observable_indicators:
    - Sauce qui tient sur le dos de la cuillère, le trait au doigt reste net
    - Couche régulière sur le mets
    - Ni trop liquide ni figée
  common_errors:
  - Sauce trop liquide qui coule et n'accroche pas
  - Sauce trop réduite qui masse
  - Nappage inégal
  not_to_be_confused_with:
  - technique_id: tech_masquer
    distinction: Napper couvre d'une couche de sauce assez réduite pour tenir ; masquer recouvre entièrement un entremets de crème ou de glaçage.
- id: tech_sauter
  name: Sauter
  aliases:
  - sauter
  - sauté
  - sautée
  - faire sauter
  category: cuisson
  difficulty: 2
  definition: 'Cuire vivement un aliment dans un peu de matière grasse très chaude, en le faisant sauter ou en le remuant, pour le colorer sans qu''il rende son jus.

    '
  hierarchy:
    parent: tech_grp_colorer_corps_gras
    level: 1
  expected_result:
    summary: L'aliment est coloré et cuit vivement dans peu de gras, remué ou sauté, sans rendre son jus.
    observable_indicators:
    - Coloration vive et homogène
    - Aliment sec et brillant, non baigné de jus
    - Mouvement constant dans la poêle
  common_errors:
  - Poêle surchargée, l'aliment bout dans son eau
  - Gras pas assez chaud
  - Trop remuer une viande qu'on veut d'abord colorer
  not_to_be_confused_with:
  - technique_id: tech_frire
    distinction: Sauter cuit vivement dans un peu de gras en remuant ; frire immerge l'aliment dans un bain de matière grasse.
  - technique_id: tech_saisir
    distinction: Sauter remue l'aliment pour le colorer sans qu'il rende son jus ; saisir le laisse au contact du feu vif pour former une croûte.
- id: tech_braiser
  name: Braiser
  aliases:
  - braiser
  - braisé
  - braisée
  - braise
  category: cuisson
  difficulty: 2
  definition: 'Cuire lentement à couvert, avec peu de liquide aromatique, un aliment d''abord rissolé, méthode douce et longue qui attendrit les pièces fermes.

    '
  hierarchy:
    parent: tech_grp_cuisson_lente
    level: 1
  expected_result:
    summary: La pièce, d'abord colorée, devient fondante après une longue cuisson douce à couvert dans peu de liquide aromatique.
    observable_indicators:
    - Chair qui se détache à la fourchette
    - Jus court, concentré et lié
    - Coloration préalable visible
  common_errors:
  - Trop de liquide, on poche au lieu de braiser
  - Ne pas avoir rissolé la pièce d'abord
  - Cuisson à découvert qui dessèche
  not_to_be_confused_with:
  - technique_id: tech_mijoter
    distinction: Braiser cuit une pièce rissolée dans peu de liquide aromatique à couvert ; mijoter la cuit longuement immergée dans le liquide.
  - technique_id: tech_confire
    distinction: Braiser cuit une pièce rissolée dans peu de liquide aromatique ; confire la cuit immergée dans un gras ou un sirop à basse température.
- id: tech_pocher
  name: Pocher
  aliases:
  - pocher
  - poché
  - pochée
  - poche
  category: cuisson
  difficulty: 2
  definition: 'Cuire un aliment dans un liquide frémissant (jamais en pleine ébullition) pour préserver sa tendreté et sa forme.

    '
  hierarchy:
    parent: tech_grp_cuisson_liquide
    level: 1
  expected_result:
    summary: L'aliment est cuit à cœur en restant moelleux et intact, dans un liquide qui frémit sans bouillir.
    observable_indicators:
    - Liquide qui frémit, sans gros bouillons
    - Forme et tendreté préservées
