- id: tech_rayer
  name: Rayer
  aliases:
  - rayer
  - rayé
  - rayée
  category: dressage
  difficulty: 2
  definition: Décorer à la pointe d'un couteau la surface dorée d'un feuilletage (galette, pâté en croûte) avant cuisson.
  hierarchy:
    parent: tech_grp_decor_feuilletage
    level: 1
  expected_result:
    summary: La surface dorée du feuilletage porte un décor régulier tracé à la pointe du couteau, sans percer la pâte.
    observable_indicators:
    - Rayures nettes et régulières
    - Dorure non transpercée
    - Motif homogène, rosace ou chevrons
  common_errors:
