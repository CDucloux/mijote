- id: db_u_wok
  name: Wok
  category: cuisson
  image: https://firebasestorage.googleapis.com/v0/b/mijote-b8a6d.firebasestorage.app/o/master%2Futensils%2Fmsekmy12ve7rty.jpg?alt=media&token=bb5997e6-6248-42be-a25a-aa420339fa4e
  usagePrecaution:
    tone: heat
    title: "Fais-le fumer avant de saisir"
    description: "Le wok se cuisine à feu vif : il doit être brûlant pour saisir sans que les aliments bouillent. Mais l'huile versée trop tôt fume et rancit."
    tip: "Chauffe le wok à vide jusqu'au léger filet de fumée, puis verse l'huile juste avant les aliments."
