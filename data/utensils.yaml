  usagePrecaution:
    tone: heat
    title: "Préchauffe et ne surcharge pas"
    description: "Large et pratique pour saisir, la sauteuse perd vite sa chaleur quand on la remplit. Trop froide ou trop chargée, les aliments rendent leur eau au lieu de dorer."
    tip: "Préchauffe à feu moyen-vif et saisis en plusieurs fois si la quantité est importante."

