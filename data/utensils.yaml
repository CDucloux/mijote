# ─── Base d'ustensiles (échantillon de format) ────────────────────────────────
# Source de vérité versionnée pour master/utensils. Format de l'import YAML
# (Configuration › Ustensiles) et de `npm run seed`.
#
# Schéma : { id?, name, category?, appliance?, image?, usagePrecaution? }
#   id              dbid stable (facultatif ; généré si absent).
#   name            nom affiché (requis).
#   usagePrecaution précaution d'utilisation éditoriale (facultative) :
#                   { tone?, title, description, tip? }. tone ∈ info|heat|warning
#                   (défaut heat) pilote l'icône/couleur ; tip = « bon réflexe ».
#   image           URL (facultatif).

- id: db_u_casserole
  name: Casserole

- id: db_u_cocotte_fonte
  name: Cocotte en fonte
  category: cuisson
  usagePrecaution:
    tone: heat
    title: Évitez le feu maximum
    description: La fonte accumule fortement la chaleur et la restitue longtemps. Chauffez progressivement à feu moyen pour mieux contrôler la cuisson et éviter de surchauffer la surface.
    tip: Commencez à feu moyen puis ajustez si nécessaire.

- id: db_u_poele_inox
  name: Poêle inox
  category: cuisson
  usagePrecaution:
    tone: heat
    title: Pas besoin de feu maximum
    description: L'inox peut devenir très chaud. Une chaleur excessive favorise l'accroche des aliments et peut brûler les matières grasses.
    tip: Préchauffez progressivement à feu moyen puis ajustez.

- id: db_u_poele_antiadhesive
  name: Poêle antiadhésive
  category: cuisson
  usagePrecaution:
    tone: warning
    title: Évitez la surchauffe
    description: Une température excessive peut détériorer le revêtement antiadhésif, notamment si l'ustensile chauffe longtemps à vide.
    tip: Utilisez plutôt une chaleur faible à moyenne et évitez de chauffer longtemps à vide.

- id: db_u_fouet
  name: Fouet

- id: db_u_chinois
  name: Chinois

- id: db_u_etamine
  name: Étamine

- id: db_u_sauteuse
  name: Sauteuse
