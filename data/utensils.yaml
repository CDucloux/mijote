    tone: warning
    title: "Vérifie soupape et joint"
    description: "Sous pression, une soupape encrassée ou un joint fatigué devient dangereux, et on ne force jamais l'ouverture tant que la pression n'est pas retombée."
    tip: "Contrôle le joint, ne remplis pas au-delà des deux tiers, et laisse la pression chuter avant d'ouvrir."

