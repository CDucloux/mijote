# ─── Chefs ────────────────────────────────────────────────────────────────────
# Liste fermée proposée dans le champ « Chef » de l'éditeur de recette. Elle est
# embarquée dans l'app à la compilation (pas d'import en console) : modifier ce
# fichier puis MEP suffit.
#
# Schéma :
#   name   nom affiché et stocké dans `recipe.chef` (unique).
#   note   repère affiché sous le nom dans la liste : restaurant, ville, ouvrage.
#   wiki   titre exact de l'article Wikipédia en français : le nom du chef sur la
#          fiche recette y renvoie. À omettre s'il n'existe pas d'article (le nom
#          reste alors un simple texte, jamais un lien vers une page vide).
#
# Une recette dont le chef n'est pas dans la liste (import, saisie ancienne) le
# garde tel quel ; l'éditeur l'affiche en tête de liste.

chefs:
  - { name: Alain Ducasse, note: "Louis XV (Monaco), Plaza Athénée", wiki: "Alain Ducasse" }
  - { name: Alain Passard, note: "L'Arpège, Paris", wiki: "Alain Passard" }
