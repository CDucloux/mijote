# ─── Glossaire des techniques culinaires ──────────────────────────────────────
# Source de vérité versionnée du glossaire (Master DB → master/techniques).
# Importé dans l'app via Configuration › Techniques (collage YAML) ou poussé par
# `npm run seed`. Édite ce fichier, puis re-seed ou ré-importe.
#
# Schéma d'une entrée :
#   id          identifiant stable (slug), unique. Préfixe `tech_`.
#   name        libellé affiché (verbe à l'infinitif, capitalisé).
#   aliases     formes du verbe à reconnaître plus tard au survol en CookMode
#               (infinitif, participe, conjugaisons courantes). Minuscules.
#   category    decoupe | cuisson | liaison | preparation | dressage
#   difficulty  entier 1–5 (1 Très facile … 5 Expert). Alimente le score de
#               difficulté d'une recette (max des gestes + modificateurs).
#   definition  1–2 phrases, rédaction originale (le texte d'Escoffier est
#               adapté, jamais recopié : l'OCR du Guide est bruité).
#   source      attribution / inspiration (facultatif).
#
# Le Guide Culinaire d'A. Escoffier (1903) est dans le domaine public.

- id: tech_suer
  name: Suer
  aliases: [suer, faire suer, sué, suée]
  category: cuisson
  difficulty: 1
  definition: >
    Cuire doucement un aliment, souvent des légumes, dans un peu de corps gras,
    à feu doux et sans coloration, pour lui faire rendre son eau et concentrer
    ses arômes avant la suite de la cuisson.
  source: "Escoffier, Le Guide Culinaire (1903)"

- id: tech_deglacer
  name: Déglacer
  aliases: [déglacer, deglacer, déglacé, déglace]
  category: cuisson
  difficulty: 2
  definition: >
    Dissoudre les sucs caramélisés au fond d'un récipient de cuisson en y versant
    un liquide (vin, fonds, vinaigre) et en grattant, pour en faire la base d'une
    sauce.
  source: "Escoffier, Le Guide Culinaire (1903)"

- id: tech_monder
  name: Monder
  aliases: [monder, émonder, emonder, mondé, monde]
  category: preparation
  difficulty: 1
  definition: >
    Retirer la peau d'un aliment (tomate, amande, pêche) après l'avoir brièvement
    plongé dans l'eau bouillante puis refroidi.

- id: tech_blanchir
  name: Blanchir
  aliases: [blanchir, blanchi, blanchie, blanchit]
  category: cuisson
  difficulty: 1
  definition: >
    Plonger un aliment quelques instants dans l'eau bouillante (puis souvent le
    rafraîchir) pour le raffermir, l'attendrir, fixer sa couleur ou en retirer
    l'âcreté.

- id: tech_emulsionner
  name: Émulsionner
  aliases: [émulsionner, emulsionner, émulsion, monter une émulsion]
  category: liaison
  difficulty: 4
  definition: >
    Mélanger énergiquement deux liquides qui ne se lient pas naturellement (gras
    et aqueux), souvent à l'aide d'un jaune d'œuf ou de moutarde, pour obtenir une
    texture homogène et stable.

- id: tech_napper
  name: Napper
  aliases: [napper, nappé, nappe, nappant]
  category: dressage
  difficulty: 2
  definition: >
    Recouvrir un mets d'une couche régulière de sauce ; la sauce « nappe » quand
    elle est assez réduite pour tenir sur le dos d'une cuillère.
  source: "Escoffier, Le Guide Culinaire (1903)"

- id: tech_sauter
  name: Sauter
  aliases: [sauter, sauté, sautée, faire sauter]
  category: cuisson
  difficulty: 2
  definition: >
    Cuire vivement un aliment dans un peu de matière grasse très chaude, en le
    faisant sauter ou en le remuant, pour le colorer sans qu'il rende son jus.

- id: tech_braiser
  name: Braiser
  aliases: [braiser, braisé, braisée, braise]
  category: cuisson
  difficulty: 2
  definition: >
    Cuire lentement à couvert, avec peu de liquide aromatique, un aliment d'abord
    rissolé, méthode douce et longue qui attendrit les pièces fermes.

- id: tech_pocher
  name: Pocher
  aliases: [pocher, poché, pochée, poche]
  category: cuisson
  difficulty: 2
  definition: >
    Cuire un aliment dans un liquide frémissant (jamais en pleine ébullition) pour
    préserver sa tendreté et sa forme.

- id: tech_rissoler
  name: Rissoler
  aliases: [rissoler, rissolé, rissolée, rissole]
  category: cuisson
  difficulty: 2
  definition: >
    Colorer vivement la surface d'un aliment dans un corps gras chaud pour obtenir
    une croûte dorée et savoureuse.
  source: "Escoffier, Le Guide Culinaire (1903)"

- id: tech_singer
  name: Singer
  aliases: [singer, singé, singe]
  category: liaison
  difficulty: 2
  definition: >
    Saupoudrer de farine un aliment en cours de cuisson, puis la cuire sur place,
    pour lier la sauce qui se formera au mouillement.
  source: "Escoffier, Le Guide Culinaire (1903)"

- id: tech_reduire
  name: Réduire
  aliases: [réduire, reduire, réduit, réduction, réduite]
  category: cuisson
  difficulty: 2
  definition: >
    Faire évaporer une partie de l'eau d'un liquide par ébullition pour en
    concentrer les saveurs et l'épaissir.

- id: tech_clarifier
  name: Clarifier
  aliases: [clarifier, clarifié, clarification, clarifie]
  category: preparation
  difficulty: 4
  definition: >
    Rendre un liquide limpide : un consommé à l'aide de blancs d'œuf et de viande
    hachée, un beurre en éliminant le petit-lait et la caséine.
  source: "Escoffier, Le Guide Culinaire (1903)"

- id: tech_ciseler
  name: Ciseler
  aliases: [ciseler, ciselé, ciselée, cisèle]
  category: decoupe
  difficulty: 1
  definition: >
    Tailler finement en très petits dés (oignon, échalote) ; pour une herbe,
    la couper en fines lanières.

- id: tech_emincer
  name: Émincer
  aliases: [émincer, emincer, émincé, émince]
  category: decoupe
  difficulty: 1
  definition: >
    Couper un aliment en tranches fines et régulières.

- id: tech_hacher
  name: Hacher
  aliases: [hacher, haché, hachée, hache]
  category: decoupe
  difficulty: 1
  definition: >
    Réduire un aliment en très petits morceaux au couteau ou au hachoir.

- id: tech_concasser
  name: Concasser
  aliases: [concasser, concassé, concassée, concasse]
  category: decoupe
  difficulty: 1
  definition: >
    Hacher grossièrement (tomates, poivre, os) en morceaux irréguliers.

- id: tech_julienne
  name: Tailler en julienne
  aliases: [julienne, tailler en julienne, en julienne]
  category: decoupe
  difficulty: 3
  definition: >
    Détailler un légume en fins bâtonnets allongés, de l'épaisseur d'une
    allumette.

- id: tech_brunoise
  name: Tailler en brunoise
  aliases: [brunoise, tailler en brunoise, en brunoise]
  category: decoupe
  difficulty: 3
  definition: >
    Détailler un légume en très petits dés réguliers, plus fins que la
    mirepoix.
  source: "Escoffier, Le Guide Culinaire (1903)"

- id: tech_chemiser
  name: Chemiser
  aliases: [chemiser, chemisé, chemisée, chemise]
  category: preparation
  difficulty: 2
  definition: >
    Tapisser l'intérieur d'un moule (de papier, de gelée, de farce, de sucre)
    avant de le garnir.

- id: tech_foncer
  name: Foncer
  aliases: [foncer, foncé, foncée, fonce]
  category: preparation
  difficulty: 2
  definition: >
    Garnir le fond et les parois d'un moule ou d'un cercle avec une abaisse de
    pâte.

- id: tech_abaisser
  name: Abaisser
  aliases: [abaisser, abaissé, abaisse, abaissée]
  category: preparation
  difficulty: 2
  definition: >
    Étaler une pâte au rouleau pour l'amener à l'épaisseur voulue ; le résultat
    s'appelle une « abaisse ».

- id: tech_paner
  name: Paner
  aliases: [paner, pané, panée, pane]
  category: preparation
  difficulty: 1
  definition: >
    Enrober un aliment de chapelure (souvent après l'avoir passé dans la farine
    puis l'œuf battu) avant de le frire ou de le sauter.

- id: tech_vanner
  name: Vanner
  aliases: [vanner, vanné, vannée, vanne]
  category: preparation
  difficulty: 1
  definition: >
    Remuer une sauce ou une crème pendant son refroidissement pour l'empêcher de
    croûter en surface et la garder lisse.
  source: "Escoffier, Le Guide Culinaire (1903)"

- id: tech_depouiller
  name: Dépouiller
  aliases: [dépouiller, depouiller, dépouillé, dépouille, dépouillement]
  category: cuisson
  difficulty: 2
  definition: >
    Retirer au fur et à mesure l'écume et les graisses qui montent à la surface
    d'un fonds ou d'une sauce en cuisson lente, pour l'affiner.
  source: "Escoffier, Le Guide Culinaire (1903)"

- id: tech_glacer
  name: Glacer
  aliases: [glacer, glacé, glacée, glace]
  category: dressage
  difficulty: 2
  definition: >
    Donner un aspect brillant à un mets : en le caramélisant légèrement, en le
    nappant d'un sirop, ou en le passant sous une chaleur vive.

- id: tech_monter_au_beurre
  name: Monter au beurre
  aliases: [monter au beurre, monté au beurre, beurre monté]
  category: liaison
  difficulty: 3
  definition: >
    Incorporer hors du feu de petits morceaux de beurre froid à une sauce en la
    fouettant, pour la lier, l'enrichir et la lustrer.

- id: tech_fouetter
  name: Fouetter
  aliases: [fouetter, fouetté, fouettée, fouette]
  category: preparation
  difficulty: 1
  definition: >
    Battre vivement au fouet pour mélanger, émulsionner ou incorporer de l'air
    (blancs en neige, crème, sauce).

- id: tech_carameliser
  name: Caraméliser
  aliases: [caraméliser, carameliser, caramélisé, caramélise]
  category: cuisson
  difficulty: 3
  definition: >
    Transformer un sucre en caramel par la chaleur ; par extension, colorer la
    surface d'un aliment riche en sucres.

- id: tech_revenir
  name: Faire revenir
  aliases: [revenir, faire revenir, revenu, revenue]
  category: cuisson
  difficulty: 1
  definition: >
    Colorer légèrement un aliment dans un corps gras chaud en début de cuisson,
    pour développer ses arômes.
  source: "Escoffier, Le Guide Culinaire (1903)"

- id: tech_mariner
  name: Mariner
  aliases: [mariner, mariné, marinée, marine, marinade]
  category: preparation
  difficulty: 1
  definition: >
    Laisser tremper un aliment dans un liquide aromatique (vin, huile, aromates)
    pour le parfumer et l'attendrir avant cuisson.

- id: tech_detendre
  name: Détendre
  aliases: [détendre, detendre, détendu, détend]
  category: liaison
  difficulty: 1
  definition: >
    Assouplir une préparation trop épaisse en y ajoutant un peu de liquide
    (eau, lait, fonds).

- id: tech_lustrer
  name: Lustrer
  aliases: [lustrer, lustré, lustrée, lustre]
  category: dressage
  difficulty: 2
  definition: >
    Donner du brillant à un mets en le badigeonnant de beurre clarifié ou de
    gelée juste avant de servir.

# ─── Ajouts : découpe avancée, cuissons, pâtisserie ───────────────────────────

- id: tech_tourner
  name: Tourner les légumes
  aliases: [tourner les légumes, légumes tournés, tournage]
  category: decoupe
  difficulty: 5
  definition: "Façonner un légume (pomme de terre, carotte, navet) en forme régulière à plusieurs faces au couteau, pour une cuisson homogène et un dressage soigné."

- id: tech_lever_filets
  name: Lever les filets
  aliases: [lever les filets, filets levés, lever un filet, lever les suprêmes]
  category: decoupe
  difficulty: 4
  definition: "Détacher proprement les filets d'un poisson le long de l'arête, ou les quartiers d'un agrume à vif, sans laisser de chair."

- id: tech_escaloper
  name: Escaloper
  aliases: [escaloper, escalopé, escalopée]
  category: decoupe
  difficulty: 2
  definition: "Couper une pièce en biais, en tranches larges et minces appelées escalopes."

- id: tech_parer
  name: Parer
  aliases: [parer, paré, parée, parage]
  category: decoupe
  difficulty: 2
  definition: "Retirer les nerfs, le gras et les parties non comestibles d'une pièce pour la rendre nette avant cuisson."

- id: tech_zester
  name: Zester
  aliases: [zester, zesté, zestée, zeste]
  category: decoupe
  difficulty: 1
  definition: "Prélever la fine partie colorée et parfumée de la peau d'un agrume, sans le blanc amer."

- id: tech_raper
  name: Râper
  aliases: [râper, raper, râpé, râpée, rapé]
  category: decoupe
  difficulty: 1
  definition: "Réduire un aliment en fins filaments ou en poudre à l'aide d'une râpe."

- id: tech_saisir
  name: Saisir
  aliases: [saisir, saisi, saisie, saisir à vif]
  category: cuisson
  difficulty: 1
  definition: "Colorer vivement la surface d'un aliment à feu très chaud pour former une croûte et fixer les sucs."

- id: tech_rotir
  name: Rôtir
  aliases: [rôtir, rotir, rôti, rôtie]
  category: cuisson
  difficulty: 1
  definition: "Cuire une pièce au four ou à la broche avec un peu de corps gras, en l'arrosant régulièrement."

- id: tech_griller
  name: Griller
  aliases: [griller, grillé, grillée]
  category: cuisson
  difficulty: 1
  definition: "Cuire un aliment par le contact direct d'une source de chaleur intense (gril, braises, plancha)."

- id: tech_mijoter
  name: Mijoter
  aliases: [mijoter, mijoté, mijotée, mijote]
  category: cuisson
  difficulty: 1
  definition: "Cuire longuement et doucement, à petits frémissements couverts, pour attendrir et lier les saveurs."

- id: tech_frire
  name: Frire
  aliases: [frire, faire frire, frit, frite]
  category: cuisson
  difficulty: 2
  definition: "Cuire un aliment par immersion dans un bain de matière grasse chaude jusqu'à ce qu'il dore et croustille."

- id: tech_confire
  name: Confire
  aliases: [confire, confit, confite, confits]
  category: cuisson
  difficulty: 2
  definition: "Cuire lentement un aliment dans un corps gras, un sirop ou du sucre, à basse température, pour l'attendrir et le conserver."

- id: tech_nacrer
  name: Nacrer
  aliases: [nacrer, nacré, nacrée]
  category: cuisson
  difficulty: 2
  definition: "Enrober les grains de riz de corps gras chaud jusqu'à ce qu'ils deviennent translucides et brillants, avant de mouiller (risotto, pilaf)."

- id: tech_flamber
  name: Flamber
  aliases: [flamber, flambé, flambée, flambe]
  category: cuisson
  difficulty: 3
  definition: "Arroser un mets d'alcool chaud et l'enflammer pour le parfumer et brûler l'alcool."

- id: tech_cuire_a_blanc
  name: Cuire à blanc
  aliases: [cuire à blanc, cuit à blanc, cuisson à blanc]
  category: cuisson
  difficulty: 2
  definition: "Précuire un fond de tarte à vide, souvent lesté de légumes secs, avant de le garnir."

- id: tech_temperer
  name: Tempérer le chocolat
  aliases: [tempérer le chocolat, chocolat tempéré, tempérage, mettre au point le chocolat]
  category: liaison
  difficulty: 5
  definition: "Faire suivre au chocolat fondu une courbe précise de température pour stabiliser ses cristaux, gage d'un rendu brillant, lisse et cassant."

- id: tech_roux
  name: Réaliser un roux
  aliases: [réaliser un roux, faire un roux, un roux, roux blond, roux brun]
  category: liaison
  difficulty: 3
  definition: "Cuire à parts égales du beurre et de la farine, plus ou moins longtemps selon la couleur voulue, pour obtenir la base liante des sauces blanches et brunes."

- id: tech_foisonner
  name: Foisonner
  aliases: [foisonner, foisonné, foisonnée, foisonnement]
  category: liaison
  difficulty: 3
  definition: "Incorporer de l'air à une préparation en la fouettant (crème, beurre, appareil) pour en augmenter le volume et l'alléger."

- id: tech_lier
  name: Lier
  aliases: [lier, lié, liée, lier la sauce]
  category: liaison
  difficulty: 2
  definition: "Épaissir et rendre homogène une préparation à l'aide d'un roux, d'un jaune d'œuf, de fécule ou de beurre."

- id: tech_serrer
  name: Serrer les blancs
  aliases: [serrer les blancs, blancs serrés, serrer la meringue]
  category: liaison
  difficulty: 2
  definition: "Terminer des blancs en neige en y ajoutant un peu de sucre tout en fouettant, pour les raffermir et les rendre lisses et brillants."

- id: tech_tourer
  name: Tourer
  aliases: [tourer, touré, tourée, donner un tour, donner les tours, tourage]
  category: preparation
  difficulty: 5
  definition: "Donner ses tours à une pâte feuilletée en pliant et abaissant successivement la détrempe et le beurre, pour créer les couches, geste long et minutieux."

- id: tech_desosser
  name: Désosser
  aliases: [désosser, desosser, désossé, désossée]
  category: preparation
  difficulty: 3
  definition: "Retirer les os d'une pièce de viande ou de volaille en préservant au mieux la chair."

- id: tech_degorger
  name: Dégorger
  aliases: [dégorger, degorger, dégorgé, dégorge]
  category: preparation
  difficulty: 2
  definition: "Faire rendre son eau à un légume au sel (concombre, aubergine), ou purger une viande ou un abat à l'eau froide."

- id: tech_petrir
  name: Pétrir
  aliases: [pétrir, petrir, pétri, pétrie, pétrissage]
  category: preparation
  difficulty: 1
  definition: "Travailler une pâte à la main ou au crochet pour l'homogénéiser et développer le réseau de gluten."

- id: tech_tamiser
  name: Tamiser
  aliases: [tamiser, tamisé, tamisée, tamise]
  category: preparation
  difficulty: 1
  definition: "Passer une poudre (farine, sucre glace) au tamis pour l'aérer et éliminer les grumeaux."

- id: tech_barder
  name: Barder
  aliases: [barder, bardé, bardée]
  category: preparation
  difficulty: 2
  definition: "Entourer une pièce d'une fine tranche de lard gras avant cuisson pour la nourrir et l'empêcher de se dessécher."

- id: tech_chiqueter
  name: Chiqueter
  aliases: [chiqueter, chiqueté, chiquetée, chiquetage]
  category: dressage
  difficulty: 3
  definition: "Inciser en biais et à intervalles réguliers les bords d'un feuilletage, pour favoriser sa levée et le décorer."

- id: tech_masquer
  name: Masquer
  aliases: [masquer, masqué, masquée]
  category: dressage
  difficulty: 2
  definition: "Recouvrir entièrement un entremets d'une couche régulière de crème ou de glaçage avant le décor."

- id: tech_dresser
  name: Dresser
  aliases: [dresser, dressé, dressée, dressage]
  category: dressage
  difficulty: 1
  definition: "Disposer harmonieusement les éléments d'un mets dans le plat ou l'assiette."

- id: tech_rayer
  name: Rayer
  aliases: [rayer, rayé, rayée]
  category: dressage
  difficulty: 2
  definition: "Décorer à la pointe d'un couteau la surface dorée d'un feuilletage (galette, pâté en croûte) avant cuisson."
