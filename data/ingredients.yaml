# ─── Base d'ingrédients (échantillon de format) ───────────────────────────────
# Source de vérité versionnée pour master/ingredients. Ce fichier montre le
# FORMAT attendu par l'import YAML (Configuration › Ingrédients) et par
# `npm run seed`. La base réelle peut rester éditée dans l'app et exportée en
# Markdown ; ce YAML sert de canon pour les valeurs qu'on veut figer dans le repo.
#
# Schéma d'une entrée :
#   id            dbid stable (facultatif ; généré si absent à l'import).
#   name          nom affiché (requis).
#   aliases       autres appellations (pour le rapprochement d'ingrédients).
#   category      clé de catégorie (voir src/constants/categories.js) — doit
#                 exister dans les catégories de la base.
#   months        mois de saison [1..12] (facultatif).
#   gramsPerPiece poids moyen d'une pièce, en g (facultatif).
#   image         URL (facultatif).
#   nutrition     valeurs pour 100 g : calories, protein, carbs, sugar, fat,
#                 saturatedFat, omega3, fiber, salt.
#   tips          [{ type, text }] — voir src/constants/tipTypes.js.

- id: db_i_carotte
  name: Carotte
  aliases: [carottes]
  category: vegetable
  months: [1, 2, 3, 9, 10, 11, 12]
  gramsPerPiece: 120
  nutrition:
    calories: 41
    protein: 0.9
    carbs: 9.6
    sugar: 4.7
    fat: 0.2
    saturatedFat: 0.04
    fiber: 2.8
    salt: 0.07

