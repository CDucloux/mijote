<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59042"/>
      <stop offset="0.55" stop-color="#e8703a"/>
      <stop offset="1" stop-color="#cf5320"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.3" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="100" height="100" rx="26" fill="url(#bg)"/>
  <rect width="100" height="100" rx="26" fill="url(#sheen)"/>
  <!-- Monogramme M (tracé symétrique) + empattements slab -->
  <g fill="none" stroke="#fff6ee" stroke-width="11.5" stroke-linejoin="round" stroke-linecap="butt">
    <path d="M27 70 V35 L50 62 L73 35 V70"/>
  </g>
  <g fill="#fff6ee">
    <!-- empattements bas, un par patte -->
    <rect x="18" y="67.5" width="18" height="4" rx="2"/>
    <rect x="64" y="67.5" width="18" height="4" rx="2"/>
    <!-- point accent de la marque -->
    <circle cx="86" cy="69.5" r="4.4"/>
  </g>
</svg>
