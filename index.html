<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Polices chargées tôt via <link> (plus fiable que @import CSS, surtout iOS/mobile). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,700;1,9..144,300&family=Hanken+Grotesk:wght@300;400;500;600;700&display=swap" />
    <!-- En PWA installée (standalone), on désactive le zoom pour un feel natif ;
         dans le navigateur classique, le zoom reste disponible (accessibilité). -->
    <script>
      (function () {
        var standalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
        if (standalone) {
          var vp = document.querySelector('meta[name="viewport"]');
          if (vp) vp.setAttribute("content", "width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover");
        }
        // Contexte « app » (PWA installée / coquille Capacitor) vs simple onglet de
        // navigateur : le splash d'ouverture (logo + onde, cf. #boot-splash) n'est
        // peint que dans ce contexte. Sur desktop / web, pas de splash du tout, la
        // page de chargement post-login prend le relais.
        if (standalone || window.Capacitor) document.documentElement.classList.add("app-shell");
        // Applique le thème AVANT le premier rendu (pas de flash) et surtout : cale la
        // couleur des barres système (statut / navigation) sur le thème de l'appli,
        // et non sur celui du système. La balise theme-color unique ci-dessous est
        // ensuite pilotée en direct par le toggle in-app (useTheme → applyThemeToDOM).
        try {
          var dark = localStorage.getItem("rf_theme") !== "light";
          if (!dark) document.documentElement.classList.add("light");
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", dark ? "#0f110d" : "#f3f4ec");
        } catch (e) {}
      })();
    </script>

    <!-- Identité -->
    <title>Cardamome, l'atelier de tes recettes</title>
    <meta name="description" content="Cardamome : crée, affine et partage tes recettes. Journal d'itérations, Nutri-Score, saisonnalité des ingrédients, planning repas et liste de courses, synchronisés sur tous tes appareils." />
    <!-- Balise UNIQUE (sans media) pilotée par l'appli : la couleur des barres PWA
         suit le thème in-app, pas celui du système. Valeur par défaut = thème sombre
         (défaut de l'appli), ajustée très tôt par le script ci-dessus puis en direct. -->
    <meta name="theme-color" content="#0f110d" />
    <link rel="canonical" href="https://mijote-sand.vercel.app/" />

    <!-- Icônes -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Logo préchargé pour le splash d'ouverture (peint avant le bundle). -->
    <link rel="preload" as="image" href="/pwa-512.png" />
    <!-- iOS n'accepte que du PNG pour l'icône d'écran d'accueil (le SVG rendait flou) -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Open Graph (Facebook, WhatsApp, iMessage, Discord…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cardamome" />
    <meta property="og:title" content="Cardamome, l'atelier de tes recettes" />
    <meta property="og:description" content="Crée, affine et partage tes recettes. Journal d'itérations, Nutri-Score, saisonnalité, planning et courses." />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:url" content="https://mijote-sand.vercel.app/" />
    <meta property="og:image" content="https://mijote-sand.vercel.app/pwa-512.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Logo Cardamome" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Cardamome, l'atelier de tes recettes" />
    <meta name="twitter:description" content="Crée, affine et partage tes recettes. Journal d'itérations, Nutri-Score, saisonnalité, planning et courses." />
    <meta name="twitter:image" content="https://mijote-sand.vercel.app/pwa-512.png" />

    <!-- Splash d'ouverture (logo + onde) : peint au TOUT PREMIER rendu, avant le
         chargement du bundle React et donc avant la page de connexion / chargement.
         Styles inline (le global.css n'est pas encore là), fonds calés sur le thème
         déjà résolu par le script plus haut (classe .light sur <html>), retrait par
         main.jsx une fois l'app montée. C'est cette couche web qui porte l'onde :
         les splashs OS (PWA, natif Capacitor) ne sont pas animables.
         Réservé au contexte « app » (PWA installée / Capacitor, classe app-shell
         posée par le script d'en-tête) : dans un onglet de navigateur (desktop / web),
         aucun splash n'est peint, la page de chargement post-login prend le relais. -->
    <style>
      #boot-splash { display: none; }
      html.app-shell #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0f110d;
        opacity: 1;
        transition: opacity 0.45s ease;
      }
      html.app-shell.light #boot-splash { background: #f3f4ec; }
      html.app-shell #boot-splash.is-hidden { opacity: 0; pointer-events: none; }
      .boot-splash__mark {
        position: relative;
        width: 116px;
        height: 116px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .boot-splash__logo {
        position: relative;
        z-index: 1;
        width: 116px;
        height: 116px;
        border-radius: 50%;
        object-fit: cover;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.28);
      }
      /* Onde concentrique qui irradie du cercle : deux anneaux décalés pour un
         rythme continu. C'est un indicateur d'ouverture (statut), pas un halo déco. */
      .boot-splash__pulse {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid #75a63f;
        opacity: 0;
      }
      html.light .boot-splash__pulse { border-color: #6e9a3f; }
      .boot-splash__logo { animation: bootBreathe 2.6s ease-in-out infinite; }
      .boot-splash__pulse { animation: bootPulse 2s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
      .boot-splash__pulse.delay { animation-delay: 1s; }
      @keyframes bootPulse {
        0%   { transform: scale(0.86); opacity: 0.5; }
        70%  { opacity: 0; }
        100% { transform: scale(1.7); opacity: 0; }
      }
      @keyframes bootBreathe {
        0%, 100% { transform: scale(1); }
        50%      { transform: scale(1.035); }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash__logo,
        .boot-splash__pulse { animation: none; }
        .boot-splash__pulse { opacity: 0; }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <div class="boot-splash__mark">
        <span class="boot-splash__pulse"></span>
        <span class="boot-splash__pulse delay"></span>
        <img class="boot-splash__logo" src="/pwa-512.png" width="116" height="116" alt="" />
      </div>
    </div>
    <script>
      // Retrait du splash : appelé par main.jsx une fois l'app montée ; filet de
      // sécurité pour ne jamais rester bloqué dessus si le bundle échoue à charger.
      window.__hideBootSplash = function () {
        var s = document.getElementById("boot-splash");
        if (!s || s.classList.contains("is-hidden")) return;
        s.classList.add("is-hidden");
        setTimeout(function () { if (s && s.parentNode) s.parentNode.removeChild(s); }, 500);
      };
      setTimeout(function () { window.__hideBootSplash(); }, 8000);
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
