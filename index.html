<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- En PWA installée (standalone), on désactive le zoom pour un feel natif ;
         dans le navigateur classique, le zoom reste disponible (accessibilité). -->
    <script>
      (function () {
        var standalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
        if (standalone) {
          var vp = document.querySelector('meta[name="viewport"]');
          if (vp) vp.setAttribute("content", "width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover");
        }
      })();
    </script>

    <!-- Identité -->
    <title>Mijoté, l'atelier de vos recettes</title>
    <meta name="description" content="Mijoté : créez, affinez et partagez vos recettes. Journal d'itérations, Nutri-Score, saisonnalité des ingrédients, planning repas et liste de courses, synchronisés sur tous vos appareils." />
    <meta name="theme-color" content="#f5f0eb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0e0f" media="(prefers-color-scheme: dark)" />
    <link rel="canonical" href="https://VOTRE-DOMAINE/" />

    <!-- Icônes -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS n'accepte que du PNG pour l'icône d'écran d'accueil (le SVG rendait flou) -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Open Graph (Facebook, WhatsApp, iMessage, Discord…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mijoté" />
    <meta property="og:title" content="Mijoté, l'atelier de vos recettes" />
    <meta property="og:description" content="Créez, affinez et partagez vos recettes. Journal d'itérations, Nutri-Score, saisonnalité, planning et courses." />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:url" content="https://VOTRE-DOMAINE/" />
    <meta property="og:image" content="https://VOTRE-DOMAINE/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mijoté, l'atelier de vos recettes" />
    <meta name="twitter:description" content="Créez, affinez et partagez vos recettes. Journal d'itérations, Nutri-Score, saisonnalité, planning et courses." />
    <meta name="twitter:image" content="https://VOTRE-DOMAINE/og-image.png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
